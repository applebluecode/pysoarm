[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pysoarm"
version = "0.1.1"
description = "Lean, hardware-level Python API for SO-100/SO-101 robot arms (Feetech STS3215 serial bus)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "pysoarm contributors", email = "noreply@pysoarm.invalid" }]
keywords = [
  "robotics",
  "so-101",
  "so-100",
  "feetech",
  "sts3215",
  "serial-bus",
  "lerobot",
  "manipulator",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Hardware :: Hardware Drivers",
  "Typing :: Typed",
]
dependencies = [
  "pyserial>=3.5",
]

[project.optional-dependencies]
# Runtime extras that end users opt into; everything dev-only lives in a PEP 735
# dependency group below, so it is never published to PyPI metadata.
# Pure-Rust SCS/STS bus driver; the fastest backend, the same one LeRobot uses.
rustypot = ["rustypot>=0.4"]
# Forward/inverse kinematics on top of a user-supplied SO-101 URDF.
kinematics = ["numpy>=1.24", "placo>=0.8"]

[project.scripts]
pysoarm = "pysoarm.cli.main:main"

[project.urls]
Homepage = "https://github.com/applebluecode/pysoarm"
Documentation = "https://applebluecode.github.io/pysoarm/"
Repository = "https://github.com/applebluecode/pysoarm"
Issues = "https://github.com/applebluecode/pysoarm/issues"
Changelog = "https://github.com/applebluecode/pysoarm/blob/main/CHANGELOG.md"

# --------------------------------------------------------------------------- #
# Development environment (PEP 735 dependency groups — not part of the package)
#   uv sync                  -> installs the default groups + the project (editable)
#   pip install --group dev -e .   -> the same without uv
# --------------------------------------------------------------------------- #
[dependency-groups]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  # The kinematics adapter imports numpy at module level while placo itself is optional,
  # so dev/test environment needs numpy to import it at all: tests/test_placo_kinematics.py
  # imports pysoarm.kinematics.placo_solver before `importorskip("placo")`, and mypy needs
  # the stubs. `placo` stays out: its tests skip when the extra is absent.
  "numpy>=1.24",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "twine>=5.1",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=1.0",
  # pymdown-extensions 12 changed Highlighter's signature and mkdocstrings 1.0.x does not
  # cope with it yet (`Highlight.__init__() missing 1 required positional argument: 'md'`),
  # so keep it below 12 until mkdocstrings supports it.
  "pymdown-extensions>=10,<12",
]
# Hardware-in-the-loop: `uv sync --group hardware`
hardware = ["pyserial>=3.5", "rustypot>=0.4"]

# Pin the package index so the committed lockfile resolves to the same artefacts for
# everyone. A mirror can still be selected ad hoc:
#   UV_DEFAULT_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple uv sync
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv]
# Groups installed by a bare `uv sync`.
default-groups = ["dev"]
# The package itself is installed in editable mode into the uv-managed venv.
package = true
# Keep the dev environment on the lowest supported minor version so that
# version-floor mistakes show up locally, not only in CI.
# (CI additionally runs 3.11 - 3.13.)

[tool.hatch.build.targets.wheel]
packages = ["src/pysoarm"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/ros2",
  "/CHANGELOG.md",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
]

# --------------------------------------------------------------------------- #
# Linting / formatting
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples", "ros2"]
extend-exclude = ["docs", "build", "dist"]

[tool.ruff.lint]
select = [
  "E", "W",          # pycodestyle
  "F",               # pyflakes
  "I",               # isort
  "N",               # pep8-naming
  "UP",              # pyupgrade
  "B",               # bugbear
  "C4",              # comprehensions
  "SIM",             # simplify
  "PTH",             # pathlib
  "RET",             # return
  "ARG",             # unused arguments
  "PL",              # pylint subset
  "RUF",             # ruff-specific
  "D",               # pydocstyle
]
ignore = [
  "D105",   # magic methods: the class docstring documents them
  "D107",   # __init__: documented under the class docstring ("Args:")
  "D203",   # one-blank-line-before-class (conflicts with D211)
  "D213",   # multi-line-summary-second-line (conflicts with D212)
  "N818",   # keep domain names readable (SafetyViolation, WatchdogTimeout)
  "PLR0913",  # too many arguments (constructors legitimately take many)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ARG", "PLR2004"]
"ros2/**" = ["D", "PLC0415"]
"examples/**" = ["D", "T201"]
"scripts/**" = ["D", "T201"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- #
# Typing
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["pyserial.*", "serial.*", "rustypot.*", "placo.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# Tests / coverage
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "hardware: needs a real arm connected over a serial port (skipped by default)",
  "slow: takes more than a couple of seconds",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["pysoarm"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
