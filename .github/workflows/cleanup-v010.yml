name: Cleanup old release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-v010.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete v0.1.0 release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete v0.1.0 --yes --cleanup-tag || true
