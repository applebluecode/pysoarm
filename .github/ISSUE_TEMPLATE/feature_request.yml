name: Feature request
description: Propose a capability or an API change.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to do today? Describe the use case, not the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch of the call you would like to write.
      render: python
    validations:
      required: false

  - type: dropdown
    id: layer
    attributes:
      label: Which layer does this belong to?
      options:
        - bus (transport / protocol)
        - arm (device lifetime, control loop)
        - safety
        - calibration
        - trajectory
        - kinematics
        - cli / tooling
        - docs
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including "do nothing" and any workaround you use today.
    validations:
      required: false
